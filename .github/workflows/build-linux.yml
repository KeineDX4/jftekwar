name: CI Linux
# No automatic triggers: runs only when started manually (Actions -> Run workflow).
on:
  workflow_dispatch:

jobs:
  # Gate: CI may only be triggered by the repo owner. GitHub Actions has no
  # built-in per-actor filter on workflow_dispatch, so the build job depends on
  # this one; a foreign actor fails it and nothing else runs.
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    steps:
      - name: Only KeineDX4 may run CI
        run: |
          if [ "${{ github.actor }}" != "KeineDX4" ] && [ "${{ github.triggering_actor }}" != "KeineDX4" ]; then
            echo "::error::CI is restricted to KeineDX4 (actor=${{ github.actor }}, triggering=${{ github.triggering_actor }})"
            exit 1
          fi

  build-linux:
    name: Linux polymost=${{ matrix.use_polymost }} gl=${{ matrix.use_opengl }} nogtk=${{ matrix.without_gtk || 1 }}
    runs-on: ubuntu-latest
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        use_polymost: [ 0, 1 ]
        use_opengl: [ 0, 1 ]
        exclude:
          - use_polymost: 1
            use_opengl: 0
        include:
          - use_polymost: 1
            use_opengl: 3
          - use_polymost: 1
            use_opengl: 'USE_GLES2'
            without_gtk: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgtk-3-dev libfluidsynth-dev
      - name: Make
        run: |
          cd "$GITHUB_WORKSPACE"
          make USE_POLYMOST=${{ matrix.use_polymost }} \
               USE_OPENGL=${{ matrix.use_opengl }} \
               WITHOUT_GTK=${{ matrix.without_gtk || 1 }} \
               USE_ASM=0 \
               all
